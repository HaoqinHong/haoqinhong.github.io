<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习笔记 | Haoqin Hong</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: #faf9f6; color: #344343; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
main, nav { width: min(calc(100% - 48px), 720px); margin: auto; }
nav { padding: 28px 0 16px; font-size: 13px; }
a { color: inherit; text-decoration: none; }
a:hover { color: #426c70; }
a:focus-visible { outline: 2px solid #426c70; outline-offset: 5px; }
header { padding: 24px 0 28px; border-bottom: 1px solid #dfe3de; }
h1 { font-size: 26px; font-weight: 500; line-height: 1.5; margin: 0; }
header p { font-size: 13px; color: #7b8581; margin: 6px 0 0; }
.essay { padding: 36px 0 40px; font-size: 16px; line-height: 2; overflow-wrap: break-word; }
.essay + .essay { border-top: 1px solid #dfe3de; }
.essay h2 { font-size: 22px; font-weight: 500; line-height: 1.55; margin: 0 0 10px; text-wrap: pretty; }
.essay .essay-meta { font-size: 13px; color: #7b8581; margin: 0 0 26px; }
.essay p { margin: 0 0 18px; }
.essay ol { margin: 20px 0 0; padding-left: 1.5em; }
.essay li { padding-left: .35em; margin: 0 0 18px; }
.essay > :last-child, .essay li:last-child { margin-bottom: 0; }
@media (max-width: 600px) {
  main, nav { width: calc(100% - 40px); }
  nav { padding: 20px 0 12px; }
  header { padding: 16px 0 24px; }
  h1 { font-size: 23px; }
  .essay { padding: 28px 0 32px; line-height: 1.95; }
  .essay h2 { font-size: 20px; }
  .essay .essay-meta { margin-bottom: 22px; }
}
.sources{font-size:13px;color:#527385;margin:22px 0}.sources a{text-decoration:underline;text-underline-offset:3px}.note-group{margin:32px 0}.note-group h2{font-size:17px;font-weight:500}.note-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.note-card{font:inherit;text-align:left;color:#245a78;border:1px solid #d3e1eb;background:linear-gradient(110deg,#eef4f8,#fff);border-radius:8px;padding:20px;min-height:100px;cursor:pointer;line-height:1.6}.note-card:hover{border-color:#719bb5}button:focus-visible{outline:2px solid #2f6fa7;outline-offset:3px}dialog{width:min(1100px,96vw);max-width:96vw;height:92dvh;max-height:94vh;padding:20px;border:1px solid #d3e1eb;border-radius:12px;background:#faf9f6;color:#344343}dialog[open]{display:flex;flex-direction:column}dialog::backdrop{background:#14253599}.reader-head,.reader-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reader-head{justify-content:space-between}.reader-head h2{font-size:18px;flex:1;margin:0 0 12px}.reader-tools button,#close-reader{padding:7px 12px;border:1px solid #ccd8df;background:white;border-radius:5px;cursor:pointer}.reader-tools button:disabled{opacity:.4;cursor:default}.reader-tools{font-size:13px}.reader-tools a{margin-left:auto;text-decoration:underline}.reader-help{font-size:12px;color:#728080;margin:10px 0}iframe{width:100%;flex:1;min-height:0;border:1px solid #dfe3de;background:white}@media(max-width:600px){.note-grid{grid-template-columns:1fr}dialog{padding:12px}.reader-head h2{font-size:15px}.reader-tools{gap:8px}}
.note-date{display:block;margin-top:10px;font-size:12px;font-weight:400;color:#74818a}</style>
<link rel="stylesheet" href="assets/css/reading-pages.css">
</head>
<body>
<nav aria-label="页面导航"><a href="index.html">返回主页</a><a href="essays.html">少观随笔</a><a href="study-notes.html" aria-current="page">学习笔记</a></nav>
<main>
<header><h1>学习笔记</h1><p>Study Notes</p></header>

<section id="entries" aria-label="学习笔记列表"></section>
<noscript>请启用 JavaScript 以查看笔记列表。</noscript>
<dialog id="reader" aria-labelledby="reader-title">
<div class="reader-head"><h2 id="reader-title"></h2><button id="close-reader" type="button">关闭</button></div>
<div class="reader-tools"><button id="previous" type="button">上一篇</button><span id="position" aria-live="polite"></span><button id="next" type="button">下一篇</button><a id="original" target="_blank" rel="noopener">打开原文件</a></div>
<p class="reader-help">文档内可翻页、缩放。若预览无法加载，请打开原文件。</p>
<iframe id="document-frame" title="学习笔记预览" allow="fullscreen"></iframe>
</dialog>
</main>

<script src="assets/js/study-notes.js"></script></body>
</html>
